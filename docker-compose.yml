services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: redis-server --maxmemory 100mb --maxmemory-policy volatile-ttl
    deploy:
      resources:
        limits:
          memory: 200m
    volumes:
      - ratly_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    ports:
      - 6380:6379
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 100m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_ORIGIN=http://localhost:3030
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "3030:80"

  load:
    build:
      context: .
      dockerfile: apps/load/Dockerfile
    environment:
      - LOAD_TARGET=http://server:3000
    depends_on:
      server:
        condition: service_healthy
    profiles:
      - load

volumes:
  ratly_redis:
