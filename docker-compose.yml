services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: redis-server --maxmemory 100mb --maxmemory-policy volatile-ttl
    deploy:
      resources:
        limits:
          memory: 200m
    volumes:
      - ratly_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  ratly_redis:
