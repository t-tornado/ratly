name: Server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/core/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/core/**"

jobs:
  checks:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build core
        run: pnpm --filter @ratly/core build

      - name: Lint
        run: pnpm --filter @ratly/server lint

      - name: Typecheck
        run: pnpm --filter @ratly/server typecheck

      - name: Build
        run: pnpm --filter @ratly/server build

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build core
        run: pnpm --filter @ratly/core build

      - name: Run unit tests
        run: pnpm --filter @ratly/server test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build core
        run: pnpm --filter @ratly/core build

      - name: Run integration tests
        run: pnpm --filter @ratly/server test:integration
        env:
          REDIS_TEST_HOST: localhost
          REDIS_TEST_PORT: 6380
