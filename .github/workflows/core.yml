name: Core

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/core/**"

jobs:
  checks:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm --filter @ratly/core typecheck

      - name: Build
        run: pnpm --filter @ratly/core build
