<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0.5 L9,4 L0,7.5Z" fill="#3D444D"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0,0.5 L9,4 L0,7.5Z" fill="#F47067"/>
    </marker>
  </defs>

  <rect width="700" height="600" rx="12" fill="#0E1116"/>

  <!-- GitHub Issue -->
  <rect x="30" y="20" width="252" height="52" rx="8" fill="#161B22" stroke="#6E7681" stroke-width="1.5"/>
  <text x="156" y="51" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">GitHub Issue</text>

  <line x1="156" y1="72" x2="156" y2="97" stroke="#3D444D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Intake -->
  <rect x="30" y="100" width="252" height="52" rx="8" fill="#161B22" stroke="#8CC0FF" stroke-width="1.5"/>
  <text x="46" y="122" fill="#E6EDF3" font-size="14" font-weight="600">Intake</text>
  <text x="46" y="139" fill="#8B949E" font-size="11">Reads issue, checks doability criteria</text>

  <!-- Not doable branch -->
  <line x1="282" y1="126" x2="425" y2="126" stroke="#F47067" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>
  <text x="326" y="118" fill="#F47067" font-size="10" font-weight="500">fails criteria</text>

  <rect x="430" y="100" width="210" height="52" rx="8" fill="#161B22" stroke="#F47067" stroke-width="1.5"/>
  <text x="446" y="122" fill="#E6EDF3" font-size="14" font-weight="600">Not Doable</text>
  <text x="446" y="139" fill="#8B949E" font-size="11">Posts comment on issue, stops</text>

  <line x1="156" y1="152" x2="156" y2="177" stroke="#3D444D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Task Plan -->
  <rect x="30" y="180" width="252" height="52" rx="8" fill="#161B22" stroke="#F2B33D" stroke-width="1.5"/>
  <text x="46" y="202" fill="#E6EDF3" font-size="14" font-weight="600">Task Plan</text>
  <text x="46" y="219" fill="#8B949E" font-size="11">Shows plan, waits for your approval</text>

  <rect x="295" y="193" width="112" height="20" rx="10" fill="#F2B33D" fill-opacity="0.12"/>
  <text x="351" y="207" text-anchor="middle" fill="#F2B33D" font-size="10" font-weight="600">HUMAN REVIEW</text>

  <line x1="156" y1="232" x2="156" y2="257" stroke="#3D444D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Worktree -->
  <rect x="30" y="260" width="252" height="52" rx="8" fill="#161B22" stroke="#8CC0FF" stroke-width="1.5"/>
  <text x="46" y="282" fill="#E6EDF3" font-size="14" font-weight="600">Worktree</text>
  <text x="46" y="299" fill="#8B949E" font-size="11">Creates isolated branch from main</text>

  <line x1="156" y1="312" x2="156" y2="337" stroke="#3D444D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Implement -->
  <rect x="30" y="340" width="252" height="52" rx="8" fill="#161B22" stroke="#8CC0FF" stroke-width="1.5"/>
  <text x="46" y="362" fill="#E6EDF3" font-size="14" font-weight="600">Implement</text>
  <text x="46" y="379" fill="#8B949E" font-size="11">Runs each step, verifies, writes proof</text>

  <line x1="156" y1="392" x2="156" y2="417" stroke="#3D444D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Quality Gates -->
  <rect x="30" y="420" width="252" height="52" rx="8" fill="#161B22" stroke="#8CC0FF" stroke-width="1.5"/>
  <text x="46" y="442" fill="#E6EDF3" font-size="14" font-weight="600">Quality Gates</text>
  <text x="46" y="459" fill="#8B949E" font-size="11">Build, tests, architecture guards</text>

  <line x1="156" y1="472" x2="156" y2="497" stroke="#3D444D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pull Request -->
  <rect x="30" y="500" width="252" height="52" rx="8" fill="#161B22" stroke="#57AB5A" stroke-width="1.5"/>
  <text x="46" y="522" fill="#E6EDF3" font-size="14" font-weight="600">Pull Request</text>
  <text x="46" y="539" fill="#8B949E" font-size="11">Opens PR with proofs, closes issue</text>

  <!-- Legend -->
  <circle cx="46" cy="576" r="4" fill="#8CC0FF"/>
  <text x="56" y="580" fill="#8B949E" font-size="10">Automated</text>
  <circle cx="138" cy="576" r="4" fill="#F2B33D"/>
  <text x="148" y="580" fill="#8B949E" font-size="10">Human checkpoint</text>
  <circle cx="268" cy="576" r="4" fill="#57AB5A"/>
  <text x="278" y="580" fill="#8B949E" font-size="10">Output</text>
  <circle cx="338" cy="576" r="4" fill="#F47067"/>
  <text x="348" y="580" fill="#8B949E" font-size="10">Stop</text>
</svg>
